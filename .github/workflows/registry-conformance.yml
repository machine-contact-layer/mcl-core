name: Registry conformance

on:
  push:
    paths:
      - "registries/**"
      - "conformance/header-v0.2-vectors.json"
      - "tools/validate_registry.py"
      - ".github/workflows/registry-conformance.yml"
  pull_request:
    paths:
      - "registries/**"
      - "conformance/header-v0.2-vectors.json"
      - "tools/validate_registry.py"
      - ".github/workflows/registry-conformance.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate assigned numbers and common-header vectors
        run: python tools/validate_registry.py
